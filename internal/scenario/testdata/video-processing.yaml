name: video-processing

publish:
  topic: video.uploaded
  key: video_789
  headers:
    - key: content-type
      value: application/json
    - key: x-client-version
      value: upload-service/2.4
  payload:
    videoId: video_789
    ownerId: creator_42
    filename: launch-demo.mp4
    contentType: video/mp4
    sizeBytes: 18432000

watch:
  - video.transcoded
  - moderation.completed
  - thumbnail.generated
  - video.published

correlation:
  header: x-flow-id

capture:
  timeout: 15s

topology:
  - from: video.uploaded
    to: video.transcoded

  - from: video.uploaded
    to: moderation.completed

  - from: video.transcoded
    to: thumbnail.generated

  - from: video.transcoded
    to: video.published
