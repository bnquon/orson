name: order-flow-fixture

publish:
  topic: ' order.created '
  payload:
    orderId: ord_fixture
    items:
      - sku: fixture-mug
        quantity: 1

watch:
  - ' payment.charged '
  - inventory.reserved

correlation:
  header: x-correlation-id

capture:
  timeout: 10s

topology:
  - from: order.created
    to: payment.charged
  - from: payment.charged
    to: inventory.reserved
